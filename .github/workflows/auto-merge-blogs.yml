name: Publish blog post and merge to main

# Fires when the blog-writer agent pushes a branch matching blog/<slug>.
# Sequence: install deps → run seed script (publishes to Sanity, uploads cover image)
#         → fast-forward / merge into main → delete blog branch → dispatch deploy.
# Secrets live in repo settings — agent never sees them, locally or remotely.

on:
  push:
    branches:
      - 'blog/**'

permissions:
  contents: write
  actions: write   # needed to dispatch deploy workflow

concurrency:
  group: auto-merge-blogs
  cancel-in-progress: false

jobs:
  publish-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve slug + seed file
        id: find
        run: |
          set -euo pipefail
          SLUG="${GITHUB_REF_NAME#blog/}"
          SEED_FILE="scripts/seed-post-${SLUG}.mjs"
          if [ ! -f "$SEED_FILE" ]; then
            echo "ERROR: $SEED_FILE not found on branch $GITHUB_REF_NAME"
            exit 1
          fi
          echo "seed_file=$SEED_FILE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish post to Sanity
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node "${{ steps.find.outputs.seed_file }}"

      - name: Merge blog branch into main
        if: success()
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          git config user.email "blog-bot@users.noreply.github.com"
          git config user.name  "blog-bot"
          git fetch origin main
          git checkout main
          if git merge --ff-only "origin/$BRANCH"; then
            echo "Fast-forwarded main from $BRANCH"
          else
            git merge --no-ff "origin/$BRANCH" -m "Merge $BRANCH into main"
          fi
          git push origin main

      - name: Delete merged blog branch
        if: success()
        run: git push origin --delete "${GITHUB_REF_NAME}" || true

      - name: Trigger deploy workflow
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main \
            || echo "WARN: deploy dispatch failed — deploy.yml may need workflow_dispatch trigger"

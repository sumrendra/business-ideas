name: Trading — Monitor Position

on:
  schedule:
    # Every 30 min, Mon–Thu, 4:00 AM–9:30 AM UTC (= 9:30 AM–3:00 PM IST)
    - cron: '0,30 4-9 * * 1-4'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  TRADING_STATE_BUCKET: ${{ secrets.TRADING_STATE_BUCKET }}

jobs:
  monitor:
    name: Check stop / target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: pip install -r trading/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('trading/requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Pull state from GCS
        run: bash trading/gcs_sync.sh pull
        env:
          TRADING_STATE_BUCKET: ${{ secrets.TRADING_STATE_BUCKET }}

      - name: Run monitor
        run: python -m trading.bot.main monitor
        env:
          KITE_API_KEY:      ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:   ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID:      ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD:     ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET:  ${{ secrets.KITE_TOTP_SECRET }}
          CAPITAL:           "75000"

      - name: Push state to GCS
        if: always()
        run: bash trading/gcs_sync.sh push
        env:
          TRADING_STATE_BUCKET: ${{ secrets.TRADING_STATE_BUCKET }}
